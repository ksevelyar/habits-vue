name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install deps
      run: npm ci
    - name: Run lint and format checks
      run: npm run lint
    - name: Run tests
      run: npm run test
